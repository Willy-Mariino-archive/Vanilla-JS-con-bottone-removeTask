<!DOCTYPE html>
<html>

<body>
    <div id="task-list"></div>

    <script>
        let tasks = [
            { id: 1, title: "Studiare React" },
            { id: 2, title: "Fare la spesa" },
            { id: 3, title: "Allenamento" }
        ];

        const removeItemById = (idToRemove) => {
            tasks = tasks.filter(item => item.id !== idToRemove);
            renderTasks();
        };

        const renderTasks = () => {
            const container = document.getElementById("task-list");
            container.innerHTML = ""; // svuoto la lista

            tasks.forEach(task => {
                const div = document.createElement("div");
                div.textContent = task.title;

                const btn = document.createElement("button");
                btn.textContent = "❌";
                btn.onclick = () => removeItemById(task.id);

                div.appendChild(btn);
                container.appendChild(div);
            });
        };

        renderTasks();
    </script>
</body>

</html>
